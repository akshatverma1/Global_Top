<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White circle background -->
  <circle cx="50" cy="50" r="48" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Orange/red building bars — left-leaning diagonal stack -->
  <g transform="translate(50,50) rotate(-18) translate(-28,-22)">
    <!-- Bar 1 (top, narrowest) -->
    <rect x="6"  y="0"  width="44" height="7"  rx="2" fill="url(#grad1)"/>
    <!-- Bar 2 -->
    <rect x="3"  y="10" width="50" height="7"  rx="2" fill="url(#grad2)"/>
    <!-- Bar 3 -->
    <rect x="0"  y="20" width="56" height="7"  rx="2" fill="url(#grad3)"/>
    <!-- Bar 4 -->
    <rect x="0"  y="30" width="54" height="7"  rx="2" fill="url(#grad4)"/>
    <!-- Bar 5 (bottom, widest) -->
    <rect x="0"  y="40" width="50" height="7"  rx="2" fill="url(#grad5)"/>
  </g>

  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
  </defs>
</svg>
